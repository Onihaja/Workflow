<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKANJO — Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="supabase-config.js" defer></script>
</head>
<body class="login-body">
  <div class="login-card">
    <!-- Image header -->
    <div class="login-image"></div>

    <!-- Contenu -->
    <div class="login-content">
      <a class="home-link" href="index.html"><div class="logo-main">AKANJO</div><div class="logo-sub">MADAGASCAR</div></a>
      <input 
        class="login-input" 
        type="text" 
        placeholder="Utilisateur" 
        disabled>

      <input 
        class="login-input" 
        type="password" 
        placeholder="Mot de passe" 
        disabled>
      <button class="login-submit" disabled>
        Se connecter
      </button>
    </div>
  </div>
</body>
</html>
