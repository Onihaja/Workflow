<html lang="fr">

  <div class="logo-main">AKANJO</div>

<div class="container">

    <div class="card-title">Section 1 · Accès</div>

    <div class="field">
      <label>Login utilisateur (à venir)</label>
      <input type="text" placeholder="Email ou matricule" disabled>
    </div>

    <div class="divider">accès direct départements (scan)</div>

    <div class="actions-grid">
            <a class="main-btn-link" href="atelier.html">Atelier</a>
