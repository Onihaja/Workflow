<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKANJO — Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="supabase-config.js"></script>
</head>
<body class="login-body">

<div class="login-split">
  <section class="login-left" aria-label="Visuel confection Akanjo">
    <div class="login-brand-overlay">
      <div class="brand-main">AKANJO</div>
      <div class="brand-sub">MADAGASCAR</div>
    </div>
  </section>

  <section class="login-right">
    <div class="login-card">
      <h1>LOGIN</h1>
      <input class="login-input" type="text" placeholder="Utilisateur" disabled>
      <input class="login-input" type="password" placeholder="Mot de passe" disabled>
      <button class="login-submit" disabled>Se connecter</button>
      <p class="login-note">Version UI uniquement — Authentification en cours d’intégration.</p>
    </div>
  </section>
</div>

</body>
</html>
