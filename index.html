<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AKANJO — Accueil</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <title>Akanjo Madagascar</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script src="supabase-config.js"></script>
</head>
<body>

<header>

  <div class="logo-main">AKANJO</div>
  <div class="logo-main">Onihaja</div>
  <div class="logo-sub">MADAGASCAR</div>
</header>

<div class="container">

  <div class="card">
    <div class="card-title">Section 1 · Accès</div>

    <div class="field">
      <label>Login utilisateur (à venir)</label>
      <input type="text" placeholder="Email ou matricule" disabled>
    </div>

    <div class="divider">ou accès direct par département</div>

    <div class="actions-grid">
      <a class="main-btn-link" href="coupe.html">Coupe (IT)</a>
      <a class="main-btn-link" href="atelier.html">Atelier</a>
      <a class="main-btn-link" href="qualite.html">Pôle Qualité</a>
      <a class="main-btn-link" href="finition.html">Finition</a>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Section 2 · Dashboard</div>
    <div class="piece-info">
      <div class="piece-info-row">
        <span class="piece-info-key">Statut</span>
        <span class="piece-info-val">Préparation en cours</span>
      </div>
      <div class="piece-info-row">
        <span class="piece-info-key">Mode</span>
        <span class="piece-info-val">Temps réel (prochaine étape)</span>
      </div>
      <div class="piece-info-row">
        <span class="piece-info-key">Chaînes</span>
        <span class="piece-info-val">CH1 à CH16 (hors CH13)</span>
      </div>
    </div>
    <a class="main-btn-link" href="#" onclick="alert('Dashboard live en cours de construction.')">Ouvrir le dashboard</a>
  </div>
</div>



  <div class="card">
    <div class="card-title">Nouvelle pièce</div>

    <div class="field"><label>Client *</label><input type="text" id="client" placeholder="ex: Chloe, Kenzo"></div>
    <div class="field"><label>Référence *</label><input type="text" id="reference" placeholder="ex: 26TS"></div>
    <div class="field"><label>Désignation *</label><input type="text" id="designation" placeholder="ex: Robe, Chemise"></div>
    <div class="field"><label>Couleur</label><input type="text" id="couleur" placeholder="ex: NR001"></div>

    <div class="field">
      <label>Chaîne de production *</label>
      <select id="chaine">
        <option value="" selected disabled>Sélectionner une chaîne</option>
        <option value="CH1">CH1</option><option value="CH2">CH2</option><option value="CH3">CH3</option>
        <option value="CH4">CH4</option><option value="CH5">CH5</option><option value="CH6">CH6</option>
        <option value="CH7">CH7</option><option value="CH8">CH8</option><option value="CH9">CH9</option>
        <option value="CH10">CH10</option><option value="CH11">CH11</option><option value="CH12">CH12</option>
        <option value="CH14">CH14</option><option value="CH15">CH15</option><option value="CH16">CH16</option>
      </select>
    </div>

    <div class="field">
      <label>Tailles et quantités *</label>
      <div class="taille-grid" id="taille-grid">
        <div class="taille-row"><label class="taille-label" for="qte-T32">T32</label><input id="qte-T32" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T34">T34</label><input id="qte-T34" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T36">T36</label><input id="qte-T36" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T38">T38</label><input id="qte-T38" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T40">T40</label><input id="qte-T40" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T42">T42</label><input id="qte-T42" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T44">T44</label><input id="qte-T44" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T46">T46</label><input id="qte-T46" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T48">T48</label><input id="qte-T48" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T50">T50</label><input id="qte-T50" type="number" min="0" value="0" class="taille-input"></div>
      </div>
    </div>

    <button class="main-btn" id="btn-generer-qr" type="button">Générer le QR code</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card qr-card" id="qr-card" style="display:none">
    <div class="card-title">QR Code</div>
    <div id="qr-box"></div>
    <div class="qr-meta" id="qr-info"></div>
    <button class="main-btn light" onclick="window.print()">Imprimer</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
