<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akanjo Madagascar</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="supabase-config.js"></script>
</head>
<body>

<header>
  <div class="logo-main">Onihaja</div>
  <div class="logo-sub">MADAGASCAR</div>
</header>

<div class="container">

  <div class="card">
    <div class="card-title">Nouvelle pièce</div>

    <div class="field"><label>Client *</label><input type="text" id="client" placeholder="ex: Chloe, Kenzo"></div>
    <div class="field"><label>Référence *</label><input type="text" id="reference" placeholder="ex: 26TS"></div>
    <div class="field"><label>Désignation *</label><input type="text" id="designation" placeholder="ex: Robe, Chemise"></div>
    <div class="field"><label>Couleur</label><input type="text" id="couleur" placeholder="ex: NR001"></div>

    <div class="field">
      <label>Chaîne de production *</label>
      <select id="chaine"></select>
    </div>

    <div class="field">
      <label>Tailles et quantités *</label>
      <div class="taille-grid" id="taille-grid"></div>
    </div>

    <button class="main-btn" onclick="creerPiece()">Générer le QR code</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card qr-card" id="qr-card" style="display:none">
    <div class="card-title">QR Code</div>
    <div id="qr-box"></div>
    <div class="qr-meta" id="qr-info"></div>
    <button class="main-btn light" onclick="window.print()">Imprimer</button>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
