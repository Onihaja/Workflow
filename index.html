<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akanjo Madagascar — Coupe</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<header>
  <div class="logo-main">AKANJO</div>
  <div class="logo-sub">MADAGASCAR</div>
</header>

<div class="container">

  <!-- Formulaire création pièce -->
  <div class="card">
    <div class="card-title">Nouvelle pièce</div>

    <div class="field">
      <label>Client *</label>
      <input type="text" id="client" placeholder="ex: Zara, H&M...">
    </div>
    <div class="field">
      <label>Référence *</label>
      <input type="text" id="reference" placeholder="ex: REF-2024-001">
    </div>
    <div class="field">
      <label>Désignation *</label>
      <input type="text" id="designation" placeholder="ex: Robe, Chemise...">
    </div>
    <div class="field">
      <label>Couleur</label>
      <input type="text" id="couleur" placeholder="ex: Bleu marine">
    </div>
    <div class="field">
      <label>Taille</label>
      <input type="text" id="taille" placeholder="ex: M, L, XL, 38">
    </div>

    <button class="main-btn" onclick="creerPiece()">Générer le QR code</button>
    <div class="msg" id="msg"></div>
  </div>

  <!-- QR Code généré -->
  <div class="card qr-card" id="qr-card" style="display:none">
    <div class="card-title">QR Code</div>
    <div id="qr-box"></div>
    <div class="qr-meta" id="qr-info"></div>
    <button class="main-btn light" onclick="window.print()">Imprimer</button>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
