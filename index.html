<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKANJO — Connexion</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-checking {
      position: fixed;
      inset: 0;
      background: #F5F0EA;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      color: #aaa;
      text-transform: uppercase;
    }
  </style>
</head>
<body class="login-body">

  <div class="auth-checking" id="auth-checking">Vérification...</div>

  <div class="login-card" id="login-card" style="display:none">

    <div class="login-image">
      <div class="login-brand-overlay">
        <div class="login-akanjo">AKANJO</div>
        <div class="login-mada">MADAGASCAR</div>
      </div>
    </div>

    <div class="login-content">

      <input
        class="login-input"
        type="email"
        id="login-email"
        placeholder="Email"
        autocomplete="email">

      <input
        class="login-input"
        type="password"
        id="login-password"
        placeholder="Mot de passe"
        autocomplete="current-password">

      <div class="msg" id="login-msg" style="text-align:left"></div>

      <button class="login-submit" id="login-btn" onclick="seConnecter()">
        Se connecter
      </button>

    </div>
  </div>

<script>
const { createClient } = supabase
const db = createClient(
  window.SUPABASE_CONFIG.url,
  window.SUPABASE_CONFIG.anonKey
)

// Vérifier si déjà connecté
;(async () => {
  const { data: { session } } = await db.auth.getSession()
  if (session) {
    const { data: profile } = await db
      .from('profiles')
      .select('role')
      .eq('id', session.user.id)
      .single()
    if (profile) { redirectParRole(profile.role); return }
  }
  document.getElementById('auth-checking').style.display = 'none'
  document.getElementById('login-card').style.display = 'block'
  document.getElementById('login-email').focus()
})()

async function seConnecter() {
  const email    = document.getElementById('login-email').value.trim()
  const password = document.getElementById('login-password').value
  const msg      = document.getElementById('login-msg')
  const btn      = document.getElementById('login-btn')

  if (!email || !password) {
    msg.className = 'msg error'
    msg.textContent = 'Veuillez saisir votre email et mot de passe.'
    return
  }

  btn.disabled = true
  btn.textContent = 'Connexion...'
  msg.className = 'msg'

  const { data, error } = await db.auth.signInWithPassword({ email, password })

  if (error) {
    btn.disabled = false
    btn.textContent = 'Se connecter'
    msg.className = 'msg error'
    msg.textContent = 'Email ou mot de passe incorrect.'
    return
  }

  const { data: profile } = await db
    .from('profiles')
    .select('role, nom')
    .eq('id', data.user.id)
    .single()

  if (!profile) {
    await db.auth.signOut()
    btn.disabled = false
    btn.textContent = 'Se connecter'
    msg.className = 'msg error'
    msg.textContent = 'Compte non configuré. Contactez l\'administrateur.'
    return
  }

  redirectParRole(profile.role)
}

function redirectParRole(role) {
  const map = {
    admin:       'admin.html',
    it:          'coupe.html',
    superviseur: 'objectifs.html'
  }
  window.location.href = map[role] || 'dashboard.html'
}

// Connexion avec la touche Entrée
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') seConnecter()
})
</script>
</body>
</html>
