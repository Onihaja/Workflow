<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKANJO — Objectifs journaliers</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="objectifs.css">
</head>
<body>
<header>
  <a class="home-link" href="index.html">
    <div class="logo-main">AKANJO</div>
    <div class="logo-sub">MADAGASCAR</div>
  </a>
  <div class="dept-label">Objectifs journaliers — Superviseur</div>
</header>

<div class="container" style="max-width:720px">
  <a class="main-btn-link" href="dashboard.html">→ Voir le dashboard TV</a>

  <div class="card" style="margin-top:16px">
    <div class="obj-header">
      <div class="card-title" style="margin-bottom:0">Objectifs du jour</div>
      <div class="obj-date" id="obj-date"></div>
    </div>
    <p style="font-size:12px;color:#aaa;font-family:Arial,sans-serif;margin-top:4px;margin-bottom:20px;letter-spacing:0.5px;">
      Saisissez l'objectif journalier pour chaque référence active par chaîne.
    </p>

    <div id="obj-content">
      <div style="text-align:center;padding:40px;color:#aaa;font-family:Arial,sans-serif;font-size:12px;">
        Chargement...
      </div>
    </div>

    <div class="save-bar">
      <button class="main-btn" style="margin-top:0" onclick="sauvegarderObjectifs()">
        Enregistrer tous les objectifs
      </button>
      <a class="main-btn light" href="dashboard.html" style="margin-top:0;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;">
        Voir le dashboard
      </a>
    </div>
    <div class="msg msg-save" id="msg-save"></div>
  </div>
</div>

<script>
const SUPABASE_URL = window.SUPABASE_CONFIG?.url
const SUPABASE_KEY = window.SUPABASE_CONFIG?.anonKey
const { createClient } = supabase
const db = createClient(SUPABASE_URL, SUPABASE_KEY)

const CHAINES = [
  'CH1','CH2','CH3','CH4','CH5','CH6','CH7',
  'CH8','CH9','CH10','CH11','CH12',
  'CH14','CH15','CH16','CH17',

  'BRODERIE_MACHINE',
  'HVA',
  'BRODERIE_MAIN'
]

let donneesActuelles = [] // { chaine, reference, objectif, cumul, total, taux }

function dateAujourdhui() {
  return new Date().toISOString().slice(0, 10)
}

function afficherDate() {
  const d = new Date()
  document.getElementById('obj-date').textContent =
    d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
}

async function chargerDonnees() {
  const today = dateAujourdhui()

  // Objectifs existants pour aujourd'hui
  const { data: objectifs } = await db
    .from('objectifs_journaliers')
    .select('*')
    .eq('date', today)

 // récupère les produits actifs
const { data: produits } = await db
  .from('produits')
  .select('id, reference, chaine_production')
  .not('chaine_production', 'is', null)
  .eq('active', true) 

  // Toutes les productions cumulées
  const { data: productions } = await db
    .from('mouvements')
    .select('produit_id')
    .eq('action', 'sortie_chaine')

  const idsProds = new Set((productions || []).map(p => p.produit_id))

  // Construire les données
  donneesActuelles = []

  CHAINES.forEach(chaine => {
    const prodsDeLaChaine = (produits || []).filter(p => p.chaine_production === chaine)
    const refs = [...new Set(prodsDeLaChaine.map(p => p.reference))].filter(Boolean)

    refs.forEach(ref => {
      const prodsDeLaRef = prodsDeLaChaine.filter(p => p.reference === ref)
      const total  = prodsDeLaRef.length
      const cumul  = prodsDeLaRef.filter(p => idsProds.has(p.id)).length
      const taux   = total > 0 ? Math.round((cumul / total) * 100) : 0
      const objRow = (objectifs || []).find(o => o.chaine === chaine && o.reference === ref)

      donneesActuelles.push({
        chaine,
        reference: ref,
        objectif:  objRow?.objectif || 0,
        objectif_id: objRow?.id || null,
        cumul,
        total,
        taux
      })
    })
  })

  rendreFormulaire()
}

function rendreFormulaire() {
  const content = document.getElementById('obj-content')
  content.innerHTML = ''

  CHAINES.forEach(chaine => {
    const refsChaine = donneesActuelles.filter(d => d.chaine === chaine)

    const section = document.createElement('div')
    section.className = 'chaine-section'

    const header = document.createElement('div')
    header.className = 'chaine-header'
    header.innerHTML = `
      <span>${chaine}</span>
      <span class="chaine-header-refs">${refsChaine.length} référence(s)</span>
    `
    section.appendChild(header)

    if (refsChaine.length === 0) {
      section.innerHTML += `<div class="empty-chaine">Aucune référence active sur cette chaîne</div>`
    } else {
      const table = document.createElement('table')
      table.className = 'obj-table'
      table.innerHTML = `
        <thead>
          <tr>
            <th>Référence</th>
            <th>Objectif / jour</th>
            <th>Cumulé</th>
            <th>Total commandé</th>
            <th>Avancement</th>
            <th>Statut</th> 
          </tr>
        </thead>
        <tbody></tbody>
      `
      const tbody = table.querySelector('tbody')

      refsChaine.forEach(d => {
        const classTaux = d.taux >= 100 ? 'taux-ok' : d.taux > 0 ? 'taux-nok' : 'taux-neu'
        const tr = document.createElement('tr')
        tr.innerHTML = `
          <td><span class="ref-tag">${d.reference}</span></td>
          <td>
            <input
              class="obj-input"
              type="number"
              min="0"
              value="${d.objectif}"
              id="obj-${chaine}-${d.reference}"
              data-chaine="${chaine}"
              data-reference="${d.reference}"
              data-id="${d.objectif_id || ''}"
            >
          </td>
          <td><strong>${d.cumul}</strong></td>
          <td class="cumul-info">${d.total} pcs</td>
          <td><span class="taux-badge ${classTaux}">${d.taux}%</span></td>
          <td>
            <button class="btn-cloture ${d.active === false ? 'btn-cloture-done' : ''}"onclick="cloturerReference('${d.chaine}', '${d.reference}')"${d.active === false ? 'disabled title="Déjà clôturée"' : 'title="Libérer cette place"'}>
              ${d.active === false ? '✓ Clôturée' : '⏹ Clôturer'}
            </button>
          </td>
        `
        tbody.appendChild(tr)
      })

      section.appendChild(table)
    }

    content.appendChild(section)
  })
}
async function cloturerReference(chaine, reference) {
  // ── Confirmation stylée ──
  const ok = confirm(
    `Clôturer la référence ${reference} sur ${chaine} ?\n\n` +
    `• Toutes les pièces seront marquées inactives\n` +
    `• L'objectif journalier sera supprimé\n` +
    `• La place sera libérée pour une nouvelle référence`
  )
  if (!ok) return

  const msg = document.getElementById('msg-save')
  msg.className = 'msg'
  msg.style.display = 'block'
  msg.textContent = `Clôture de ${reference} sur ${chaine} en cours...`

  const today = dateAujourdhui()
  let erreurs = 0

  // ── Étape 1 : Marquer les pièces inactives ──
  const { error: errProduits } = await db
    .from('produits')
    .update({ active: false })
    .eq('reference', reference)
    .eq('chaine_production', chaine)

  if (errProduits) {
    console.error(errProduits)
    erreurs++
  }

  // ── Étape 2 : Supprimer l'objectif journalier du jour ──
  const { error: errObj } = await db
    .from('objectifs_journaliers')
    .delete()
    .eq('chaine', chaine)
    .eq('reference', reference)
    .eq('date', today)

  if (errObj) {
    console.error(errObj)
    erreurs++
  }

  // ── Résultat ──
  if (erreurs > 0) {
    msg.className = 'msg error'
    msg.textContent = `⚠️ Erreur lors de la clôture de ${reference} sur ${chaine}.`
    return
  }

  msg.className = 'msg success'
  msg.textContent = `✓ Référence ${reference} clôturée sur ${chaine} — objectif supprimé.`

  setTimeout(() => {
    msg.className = 'msg'
    msg.style.display = 'none'
  }, 3000)

  // Recharger le tableau
  await chargerDonnees()
}
async function sauvegarderObjectifs() {
  const today = dateAujourdhui()
  const inputs = document.querySelectorAll('.obj-input')
  const msg = document.getElementById('msg-save')

  msg.className = 'msg'
  msg.style.display = 'block'
  msg.textContent = 'Enregistrement...'

  let erreurs = 0

  for (const input of inputs) {
    const chaine    = input.dataset.chaine
    const reference = input.dataset.reference
    const objectif  = parseInt(input.value) || 0
    const id        = input.dataset.id

    if (id) {
      // Mettre à jour
      const { error } = await db
        .from('objectifs_journaliers')
        .update({ objectif })
        .eq('id', id)
      if (error) erreurs++
    } else {
      // Insérer
      const { data, error } = await db
        .from('objectifs_journaliers')
        .insert([{ chaine, reference, objectif, date: today }])
        .select()
        .single()
      if (error) erreurs++
      else input.dataset.id = data.id
    }
  }

  if (erreurs > 0) {
    msg.className = 'msg error'
    msg.textContent = `${erreurs} erreur(s) lors de l'enregistrement.`
  } else {
    msg.className = 'msg success'
    msg.textContent = '✓ Objectifs enregistrés avec succès.'
    setTimeout(() => {
      msg.className = 'msg'
      msg.style.display = 'none'
    }, 3000)
  }
}

// ── INIT ──
afficherDate()
chargerDonnees()
</script>
</body>
</html>
