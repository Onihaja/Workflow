<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKANJO — Accueil</title>
  <link rel="stylesheet" href="style.css">
  <script src="supabase-config.js"></script>
</head>
<body class="home-body">

<section class="home-hero">
  <img class="home-hero-img" src="https://www.akanjo.com/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fbanner_confection.063568a9.jpg&w=3840&q=75" alt="Atelier Akanjo">
  <div class="home-hero-overlay"></div>
  <div class="home-hero-content">
    <div class="logo-main">AKANJO</div>
    <div class="logo-sub">MADAGASCAR</div>
  </div>
</section>

<main class="home-layout">
  <section class="home-panel">
    <h2>Accès rapide</h2>
    <div class="home-login-placeholder">
      <label>Connexion</label>
      <input type="text" placeholder="Email / matricule" disabled>
    </div>

  </section>

  <section class="home-panel">
    <h2>Dashboard usine</h2>
    <div class="home-kpis">
      <div class="kpi-box">
        <span class="kpi-label">Chaînes actives</span>
        <strong>15</strong>
        <small>CH1 → CH16 (hors CH13)</small>
      </div>
      <div class="kpi-box">
        <span class="kpi-label">Mode</span>
        <strong>Live</strong>
        <small>Prochaine étape</small>
      </div>
    </div>

    <a class="home-link-btn" href="#" onclick="alert('Le dashboard temps réel sera ajouté à l\'étape suivante.')">Ouvrir le dashboard</a>
  </section>
</main>

</body>
</html>
