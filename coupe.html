<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akanjo Madagascar — Coupe</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* ── RÉSUMÉ COMMANDE ── */
    .resume-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
      margin-bottom: 20px;
    }

    .resume-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 6px 0;
      border-bottom: 1px solid #f0ece6;
      font-family: 'Arial', sans-serif;
      font-size: 13px;
    }

    .resume-row:last-child { border-bottom: none; }

    .resume-key {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #aaa;
    }

    .resume-val {
      font-weight: 700;
      color: #1a1a1a;
    }

    .resume-total {
      grid-column: 1 / -1;
      background: #1a1a1a;
      color: #fff;
      border-radius: 2px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Arial', sans-serif;
    }

    .resume-total-label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .resume-total-val {
      font-size: 24px;
      font-weight: 700;
    }

    .tailles-resume {
      grid-column: 1 / -1;
      background: #faf8f5;
      border: 1px solid #e8e2d9;
      border-radius: 2px;
      padding: 10px 14px;
      font-family: 'Arial', sans-serif;
      font-size: 12px;
      color: #555;
      letter-spacing: 0.5px;
      line-height: 1.8;
    }

    .ids-liste {
      grid-column: 1 / -1;
      background: #faf8f5;
      border: 1px solid #e8e2d9;
      border-radius: 2px;
      padding: 10px 14px;
      font-family: 'Arial', sans-serif;
      font-size: 11px;
      color: #888;
      letter-spacing: 0.5px;
      line-height: 2;
      max-height: 120px;
      overflow-y: auto;
    }

    /* ── ZONE IMPRESSION (invisible à l'écran) ── */
    .print-zone { display: none; }

    /* ── IMPRESSION — 9 étiquettes par page A4 (3×3) ── */
    @media print {
      @page { size: A4 portrait; margin: 6mm; }

      /* Cacher tout sauf la zone d'impression */
      body > *:not(.print-zone) { display: none !important; }

      .print-zone {
        display: block !important;
        width: 100%;
        margin: 0;
        padding: 0;
      }

      .print-page {
        width: 100%;
        page-break-after: always;
        break-after: page;
      }

      .print-page:last-child {
        page-break-after: auto;
        break-after: auto;
      }

      .print-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 3mm;
        width: 100%;
      }

      .print-cell {
        border: 1.5px solid #111;
        flex-direction: column;
        break-inside: avoid;
        page-break-inside: avoid;
        overflow: hidden;
        min-height: 90mm;
      }

      .print-cell-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 3mm 3mm 2mm 3mm;
        border-bottom: 1.5px solid #111;
        gap: 2mm;
      }

      .print-cell-infos {
        flex: 1;
        font-family: Arial, sans-serif;
      }

      .print-cell-infos p {
        font-size: 8.5pt;
        font-weight: 700;
        margin: 0 0 1mm 0;
        line-height: 1.35;
        color: #000;
      }

      .print-cell-infos .lbl { font-weight: 400; }

      .print-cell-code {
        font-size: 8pt;
        font-weight: 700;
        margin-top: 2mm;
        color: #000;
        font-family: Arial, sans-serif;
        word-break: break-all;
      }

      .print-cell-qr {
        flex-shrink: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }

      .print-cell-qr canvas,
      .print-cell-qr img {
        width: 22mm !important;
        height: 22mm !important;
      }

      .print-cell-lines {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        padding: 1mm 3mm;
      }

      .print-dot-line {
        border: none;
        border-bottom: 1px dashed #aaa;
        height: 0;
        margin: 0;
      }
    }
  </style>
</head>
<body>
<header>
  <a class="home-link" href="index.html">
    <div class="logo-main">AKANJO</div>
    <div class="logo-sub">MADAGASCAR</div>
  </a>
  <div class="dept-label">Département Coupe</div>
</header>

<div class="container">
  <a class="main-btn-link" href="index.html">← Retour accueil</a>

  <!-- ── FORMULAIRE ── -->
  <div class="card" id="card-form">
    <div class="card-title">Nouvelle commande</div>

    <div class="field">
      <label>Client</label>
      <input type="text" id="client" placeholder="ex: Chloé, Kenzo">
    </div>

    <div class="field">
      <label>Référence</label>
      <input type="text" id="reference" placeholder="ex: 26TS">
    </div>

    <div class="field">
      <label>Désignation</label>
      <select id="designation">
        <option value="" selected disabled>Sélectionner une désignation</option>
          <option value="ROBE">ROBE</option>
          <option value="ROBE LONGUE">ROBE LONGUE</option>
          <option value="ROBE COURTE">ROBE COURTE</option>
          <option value="PANTALON">PANTALON</option>
          <option value="SHORT">SHORT</option>
          <option value="JUPE">JUPE</option>
          <option value="JUPE LONGUE">JUPE LONGUE</option>
          <option value="JUPE COURTE">JUPE COURTE</option>
          <option value="SLIP">SLIP</option>
          <option value="SOUTIEN-GORGE">SOUTIEN-GORGE</option>
          <option value="BIKINI">BIKINI</option>
          <option value="CHEMISE">CHEMISE</option>
          <option value="CHEMISIER">CHEMISIER</option>
          <option value="T-SHIRT">T-SHIRT</option>
          <option value="POLO">POLO</option>
          <option value="BLOUSE">BLOUSE</option>
          <option value="TUNIQUE">TUNIQUE</option>
          <option value="TOP">TOP</option>
          <option value="GILET">GILET</option>
          <option value="VESTE">VESTE</option>
          <option value="MANTEAU">MANTEAU</option>
          <option value="DOUDOUNE">DOUDOUNE</option>
          <option value="KIMONO">KIMONO</option>
          <option value="BLOUSE DE TRAVAIL">BLOUSE DE TRAVAIL</option>
          <option value="UNIFORME">UNIFORME</option>
      </select>
    </div>

    <div class="field">
      <label>Couleur</label>
      <input type="text" id="couleur" placeholder="ex: NR001">
    </div>

    <div class="field">
      <label>Chaîne de production</label>
      <select id="chaine">
        <option value="" selected disabled>Sélectionner une chaîne</option>
        <optgroup label="Chaînes de production">
          <option value="CH1">CH1</option>
          <option value="CH2">CH2</option>
          <option value="CH3">CH3</option>
          <option value="CH4">CH4</option>
          <option value="CH5">CH5</option>
          <option value="CH6">CH6</option>
          <option value="CH7">CH7</option>
          <option value="CH8">CH8</option>
          <option value="CH9">CH9</option>
          <option value="CH10">CH10</option>
          <option value="CH11">CH11</option>
          <option value="CH12">CH12</option>
          <option value="CH14">CH14</option>
          <option value="CH15">CH15</option>
          <option value="CH16">CH16</option>
        </optgroup>
        <optgroup label="Sections spéciales">
          <option value="BRODERIE_MACHINE">Broderie Machine</option>
          <option value="HVA">Haute Valeur Ajoutée (HVA)</option>
          <option value="BRODERIE_MAIN">Broderie Main</option>
        </optgroup>
      </select>
    </div>

    <div class="field">
      <label>Tailles et quantités</label>
      <div class="taille-grid" id="taille-grid">
        <div class="taille-row"><label class="taille-label" for="qte-T32">T32</label><input id="qte-T32" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T34">T34</label><input id="qte-T34" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T36">T36</label><input id="qte-T36" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T38">T38</label><input id="qte-T38" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T40">T40</label><input id="qte-T40" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T42">T42</label><input id="qte-T42" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T44">T44</label><input id="qte-T44" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T46">T46</label><input id="qte-T46" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T48">T48</label><input id="qte-T48" type="number" min="0" value="0" class="taille-input"></div>
        <div class="taille-row"><label class="taille-label" for="qte-T50">T50</label><input id="qte-T50" type="number" min="0" value="0" class="taille-input"></div>
      </div>
    </div>

    <button class="main-btn" id="btn-generer-qr" type="button" onclick="creerPieces()">Générer les QR codes</button>
    <div class="msg" id="msg"></div>
  </div>

  <!-- ── CONFIRMATION (après génération) ── -->
  <div class="card" id="card-confirm" style="display:none">
    <div class="card-title">Commande enregistrée</div>

    <div class="resume-grid" id="resume-grid"></div>

    <button class="main-btn" onclick="imprimerQR()">🖨 Imprimer les QR codes</button>
    <button class="main-btn light" onclick="nouvelleCommande()" style="margin-top:10px">+ Nouvelle commande</button>
  </div>

</div>

<!-- ── ZONE IMPRESSION ── -->
<div class="print-zone" id="print-zone" style="display:none"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
</body>
</html>
