<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKANJO — Dashboard Production</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body class="dashboard-prod">
<div class="loading" id="loading">
  <div class="loading-brand">AKANJO</div>
  <div class="spinner"></div>
  <div style="font-size:11px;letter-spacing:2px;color:#aaa;text-transform:uppercase">Chargement...</div>
</div>

<!-- HEADER -->
<header class="header">
  <div>
    <span class="header-brand">AKANJO <span>Madagascar — Production</span></span>
  </div>
  <div class="header-right">
    <div>
      <div class="header-clock" id="clock">--:--:--</div>
      <div class="header-date" id="date-label"></div>
    </div>
    <div class="header-live"><span class="live-dot"></span>LIVE</div>
    <a class="header-link" href="objectifs.html">⚙ Objectifs</a>
  </div>
</header>

<!-- CORPS -->
<div class="dash-body">

  <!-- Zone chaînes normales -->
  <div class="zone-chaines" id="zone-chaines"></div>

  <!-- Zone sections spéciales -->
  <div class="zone-speciale">

    <div class="section-block brod-main">
      <div class="section-title">Broderie Main</div>
      <div class="section-grid" id="grid-brod-main"></div>
    </div>

    <div class="section-block hva">
      <div class="section-title">Haute Valeur Ajoutée</div>
      <div class="section-grid" id="grid-hva"></div>
    </div>

    <div class="section-block brod-mach">
      <div class="section-title">Broderie Machine</div>
      <div class="section-grid" id="grid-brod-mach"></div>
    </div>

  </div>
</div>

<!-- FOOTER — compteurs globaux -->
<footer class="dash-footer">
  <div class="global-counter">
    <div class="global-label">Production</div>
    <div class="global-val" id="cpt-production">0</div>
  </div>
  <div class="global-counter">
    <div class="global-label">Pôle Qualité</div>
    <div class="global-val" id="cpt-qualite">0</div>
  </div>
  <div class="global-counter">
    <div class="global-label">Finition</div>
    <div class="global-val" id="cpt-finition">0</div>
  </div>
</footer>

<script>
// ══ CONFIG ══
const { createClient } = supabase
const db = createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey)

// ══ CONSTANTES ══
const CHAINES_NORMALES = [
  'CH1','CH2','CH3','CH4','CH5',
  'CH6','CH7','CH8','CH9','CH10',
  'CH11','CH12','CH14','CH15','CH16'
]

const SECTIONS_SPECIALES = {
  'BRODERIE_MAIN':    { id: 'grid-brod-main', maxRefs: 8 },
  'HVA':              { id: 'grid-hva',       maxRefs: 4 },
  'BRODERIE_MACHINE': { id: 'grid-brod-mach', maxRefs: 4 },
}

const TOUTES_CHAINES = [...CHAINES_NORMALES, ...Object.keys(SECTIONS_SPECIALES)]

// ══ HORLOGE ══
function majHorloge() {
  const n = new Date()
  document.getElementById('clock').textContent =
    n.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit', second:'2-digit' })
  document.getElementById('date-label').textContent =
    n.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' })
}
setInterval(majHorloge, 1000)
majHorloge()

// ══ DATE ══
const today = () => new Date().toISOString().slice(0, 10)

// ══ CHARGEMENT DONNÉES ══
async function charger() {
  const t = today()

  const [
    { data: objectifs },
    { data: sorties_chaine },
    { data: entrees_qualite },
    { data: entrees_finition },
    { data: produits }
  ] = await Promise.all([
    db.from('objectifs_journaliers').select('*').eq('date', t),
    db.from('mouvements').select('produit_id').eq('action', 'sortie_chaine').gte('created_at', t + 'T00:00:00'),
    db.from('mouvements').select('produit_id').eq('action', 'entree_qualite').gte('created_at', t + 'T00:00:00'),
    db.from('mouvements').select('produit_id').eq('action', 'entree_finition').gte('created_at', t + 'T00:00:00'),
    db.from('produits').select('id, reference, chaine_production').not('chaine_production', 'is', null),
  ])

  // IDs par action aujourd'hui
  const idsSortieChaine   = new Set((sorties_chaine   || []).map(m => m.produit_id))
  const idsEntreeQualite  = new Set((entrees_qualite  || []).map(m => m.produit_id))
  const idsEntreeFinition = new Set((entrees_finition || []).map(m => m.produit_id))

  // Cumul toutes productions
  const { data: toutesProductions } = await db
    .from('mouvements').select('produit_id').eq('action', 'sortie_chaine')
  const idsToutesProductions = new Set((toutesProductions || []).map(m => m.produit_id))

  // ── Compteurs globaux ──
  const cptProd = idsSortieChaine.size
  const cptQual = idsEntreeQualite.size
  const cptFini = idsEntreeFinition.size

  const elProd = document.getElementById('cpt-production')
  const elQual = document.getElementById('cpt-qualite')
  const elFini = document.getElementById('cpt-finition')

  elProd.textContent = cptProd
  elQual.textContent = cptQual
  elFini.textContent = cptFini
  elProd.className = 'global-val' + (cptProd > 0 ? ' has-data' : '')
  elQual.className = 'global-val' + (cptQual > 0 ? ' has-data' : '')
  elFini.className = 'global-val' + (cptFini > 0 ? ' has-data' : '')

  // ── Construire données par chaîne ──
  const dataParChaine = {}

  TOUTES_CHAINES.forEach(chaine => {
    const prodsDeLaChaine = (produits || []).filter(p => p.chaine_production === chaine)
    const refs = [...new Set(prodsDeLaChaine.map(p => p.reference))].filter(Boolean)

    dataParChaine[chaine] = refs.map(ref => {
      const prodsDeLaRef = prodsDeLaChaine.filter(p => p.reference === ref)
      const total   = prodsDeLaRef.length
      const aujourdhui = prodsDeLaRef.filter(p => idsSortieChaine.has(p.id)).length
      const cumul   = prodsDeLaRef.filter(p => idsToutesProductions.has(p.id)).length
      const taux    = total > 0 ? Math.round((cumul / total) * 100) : 0
      const obj     = (objectifs || []).find(o => o.chaine === chaine && o.reference === ref)

      return {
        reference: ref,
        aujourdhui,
        cumul,
        total,
        taux,
        objectif: obj?.objectif || 0
      }
    })
  })

  // ── Rendu chaînes normales ──
  const zoneChaines = document.getElementById('zone-chaines')
  zoneChaines.innerHTML = ''
  CHAINES_NORMALES.forEach(ch => {
    zoneChaines.appendChild(creerCarteChaine(ch, dataParChaine[ch] || [], 2))
  })

  // ── Rendu sections spéciales ──
  Object.entries(SECTIONS_SPECIALES).forEach(([chaine, cfg]) => {
    const grid = document.getElementById(cfg.id)
    grid.innerHTML = ''
    const refs = dataParChaine[chaine] || []
    // Remplir jusqu'au maxRefs avec des postes vides
    for (let i = 0; i < cfg.maxRefs; i++) {
      const ref = refs[i] || null
      grid.appendChild(creerPoste(ref, objectifs, chaine))
    }
  })

  document.getElementById('loading').style.display = 'none'
}

// ══ CARTE CHAÎNE NORMALE (max 2 refs) ══
function creerCarteChaine(chaine, refs, maxRefs) {
  const card = document.createElement('div')
  card.className = 'chain-card'

  // Nom
  const nom = document.createElement('div')
  nom.className = 'chain-name'
  nom.textContent = chaine
  card.appendChild(nom)

  // Ligne refs
  const refsRow = document.createElement('div')
  refsRow.className = 'chain-refs-row'

  const refsAAfficher = Array.from({ length: maxRefs }, (_, i) => refs[i] || null)

  refsAAfficher.forEach(r => {
    const col = document.createElement('div')
    col.className = 'ref-col'
    col.innerHTML = `
      <div class="ref-col-label">Réf</div>
      <div class="ref-col-value ${r ? '' : 'empty'}">${r ? r.reference : '—'}</div>
    `
    refsRow.appendChild(col)
  })
  card.appendChild(refsRow)

  // Données
  const dataRow = document.createElement('div')
  dataRow.className = 'chain-data'

  refsAAfficher.forEach(r => {
    const col = document.createElement('div')
    col.className = 'ref-data-col'

    if (!r) {
      col.innerHTML = `
        <div class="ref-data-top">
          <span class="val-obj">0</span>
          <span class="val-taux">0%</span>
        </div>
        <div class="ref-counter-wrap">
          <div class="ref-counter neutral">0</div>
        </div>
        <div class="ref-cumul">0</div>
        <div class="ref-bar"><div class="ref-bar-fill nok" style="width:0%"></div></div>
      `
    } else {
      const atteint = r.objectif > 0 && r.aujourdhui >= r.objectif
      const couleur = r.objectif === 0 ? 'neutral' : (atteint ? 'ok' : 'nok')
      const barre   = r.total > 0 ? Math.min(100, Math.round((r.cumul / r.total) * 100)) : 0

      col.innerHTML = `
        <div class="ref-data-top">
          <span class="val-obj">${r.objectif}</span>
          <span class="val-taux">${r.taux}%</span>
        </div>
        <div class="ref-counter-wrap">
          <div class="ref-counter ${couleur}">${r.aujourdhui}</div>
        </div>
        <div class="ref-cumul">${r.cumul}</div>
        <div class="ref-bar"><div class="ref-bar-fill ${atteint ? 'ok' : 'nok'}" style="width:${barre}%"></div></div>
      `
    }
    dataRow.appendChild(col)
  })

  card.appendChild(dataRow)
  return card
}

// ══ POSTE SECTION SPÉCIALE ══
function creerPoste(r, objectifs, chaine) {
  const card = document.createElement('div')
  card.className = 'poste-card'

  if (!r) {
    card.innerHTML = `
      <div class="poste-ref-bar">
        <div class="poste-ref-label">Réf</div>
        <div class="poste-ref-value empty">—</div>
      </div>
      <div class="poste-data">
        <div class="poste-top">
          <span class="val-obj" style="font-size:9px">0</span>
          <span class="val-taux" style="font-size:9px">0%</span>
        </div>
        <div class="poste-counter-wrap">
          <div class="poste-counter neutral">0</div>
        </div>
        <div class="poste-cumul">0</div>
      </div>
    `
    return card
  }

  const atteint = r.objectif > 0 && r.aujourdhui >= r.objectif
  const couleur = r.objectif === 0 ? 'neutral' : (atteint ? 'ok' : 'nok')

  card.innerHTML = `
    <div class="poste-ref-bar">
      <div class="poste-ref-label">Réf</div>
      <div class="poste-ref-value">${r.reference}</div>
    </div>
    <div class="poste-data">
      <div class="poste-top">
        <span class="val-obj" style="font-size:9px">${r.objectif}</span>
        <span class="val-taux" style="font-size:9px">${r.taux}%</span>
      </div>
      <div class="poste-counter-wrap">
        <div class="poste-counter ${couleur}">${r.aujourdhui}</div>
      </div>
      <div class="poste-cumul">${r.cumul}</div>
    </div>
  `
  return card
}

// ══ REALTIME ══
db.channel('dash-live')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'mouvements' }, charger)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'objectifs_journaliers' }, charger)
  .subscribe()

// ══ INIT ══
charger()
setInterval(charger, 60000)
</script>
</body>
</html>
