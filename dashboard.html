<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKANJO — Dashboard Production</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;900&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="loading" id="loading">
  <div class="loading-brand">AKANJO</div>
  <div class="spinner"></div>
  <div style="font-size:11px;letter-spacing:2px;color:#aaa;text-transform:uppercase">Chargement...</div>
</div>

<div class="page">

  <!-- HEADER -->
  <header class="header">
    <div class="header-brand">AKANJO <span>Madagascar</span></div>
    <div class="header-right">
      <div>
        <div class="header-clock" id="clock">--:--:--</div>
        <div class="header-date" id="date-label"></div>
      </div>
      <div class="header-live"><span class="live-dot"></span>LIVE</div>
      <a class="header-link" href="objectifs.html">⚙ Objectifs</a>
    </div>
  </header>

  <!-- CORPS : 6 colonnes × 4 lignes -->
  <div class="dash-body">

    <!-- GAUCHE : chaînes 4col × 4lig -->
    <div class="zone-chaines" id="zone-chaines"></div>

    <!-- DROITE : 2col × 4lig -->
    <div class="zone-speciale">

      <!-- Ligne 1 : Broderie Machine 2col × 1lig -->
      <div class="section-block brod-mach">
        <div class="section-title">BRODERIE MACHINE</div>
        <div class="section-grid" id="grid-brod-mach"></div>
      </div>

      <!-- Ligne 2 : HVA 2col × 1lig -->
      <div class="section-block hva">
        <div class="section-title">HAUTE VALEUR AJOUTÉE</div>
        <div class="section-grid" id="grid-hva"></div>
      </div>

      <!-- Lignes 3-4 : Broderie Main 2col × 2lig -->
      <div class="section-block brod-main">
        <div class="section-title">BRODERIE MAIN</div>
        <div class="section-grid" id="grid-brod-main"></div>
      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <footer class="dash-footer">
    <div class="global-counter">
      <div class="global-text">
        <div class="global-label">Production</div>
        <div class="global-val" id="cpt-production">0</div>
      </div>
    </div>
    <div class="global-counter">
      <div class="global-text">
        <div class="global-label">Pôle Qualité</div>
        <div class="global-val" id="cpt-qualite">0</div>
      </div>
    </div>
    <div class="global-counter">
      <div class="global-text">
        <div class="global-label">Finition</div>
        <div class="global-val" id="cpt-finition">0</div>
      </div>
    </div>
  </footer>

</div>

<script>
const { createClient } = supabase
const db = createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey)

const CHAINES_NORMALES = [
  'CH1','CH2','CH3','CH4',
  'CH5','CH6','CH7','CH8',
  'CH9','CH10','CH11','CH12',
  'CH14','CH15','CH16'
]

const SECTIONS_SPECIALES = {
  'BRODERIE_MACHINE': { id: 'grid-brod-mach', maxRefs: 2 },
  'HVA':              { id: 'grid-hva',       maxRefs: 2 },
  'BRODERIE_MAIN':    { id: 'grid-brod-main', maxRefs: 4 },
}

const TOUTES_CHAINES = [...CHAINES_NORMALES, ...Object.keys(SECTIONS_SPECIALES)]

// ══ HORLOGE ══
function majHorloge() {
  const n = new Date()
  document.getElementById('clock').textContent =
    n.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit', second:'2-digit' })
  document.getElementById('date-label').textContent =
    n.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' })
}
setInterval(majHorloge, 1000)
majHorloge()

const today = () => new Date().toISOString().slice(0, 10)

async function charger() {
  const t = today()

  const [
    { data: objectifs },
    { data: sorties_chaine },
    { data: entrees_qualite },
    { data: entrees_finition },
    { data: produits },
    { data: toutesProductions }
  ] = await Promise.all([
    db.from('objectifs_journaliers').select('*').eq('date', t),
    db.from('mouvements').select('produit_id').eq('action','sortie_chaine').gte('created_at', t+'T00:00:00'),
    db.from('mouvements').select('produit_id').eq('action','entree_qualite').gte('created_at', t+'T00:00:00'),
    db.from('mouvements').select('produit_id').eq('action','entree_finition').gte('created_at', t+'T00:00:00'),
    db.from('produits').select('id,reference,chaine_production').not('chaine_production','is',null),
    db.from('mouvements').select('produit_id').eq('action','sortie_chaine'),
  ])

  const idsSortie   = new Set((sorties_chaine    ||[]).map(m=>m.produit_id))
  const idsQualite  = new Set((entrees_qualite   ||[]).map(m=>m.produit_id))
  const idsFinition = new Set((entrees_finition  ||[]).map(m=>m.produit_id))
  const idsCumul    = new Set((toutesProductions ||[]).map(m=>m.produit_id))

  // Compteurs globaux
  const elProd = document.getElementById('cpt-production')
  const elQual = document.getElementById('cpt-qualite')
  const elFini = document.getElementById('cpt-finition')
  elProd.textContent = idsSortie.size
  elQual.textContent = idsQualite.size
  elFini.textContent = idsFinition.size
  elProd.className = 'global-val' + (idsSortie.size   > 0 ? ' has-data-green'  : '')
  elQual.className = 'global-val' + (idsQualite.size  > 0 ? ' has-data-green'  : '')
  elFini.className = 'global-val' + (idsFinition.size > 0 ? ' has-data-orange' : '')

  // Données par chaîne
  const dataParChaine = {}
  TOUTES_CHAINES.forEach(ch => {
    const prods = (produits||[]).filter(p => p.chaine_production === ch)
    const refs  = [...new Set(prods.map(p=>p.reference))].filter(Boolean)
    dataParChaine[ch] = refs.map(ref => {
      const r        = prods.filter(p=>p.reference===ref)
      const total    = r.length
      const auj      = r.filter(p=>idsSortie.has(p.id)).length
      const cumul    = r.filter(p=>idsCumul.has(p.id)).length
      const taux     = total>0 ? Math.round((cumul/total)*100) : 0
      const obj      = (objectifs||[]).find(o=>o.chaine===ch&&o.reference===ref)
      const objectif = obj?.objectif||0
      const objPct   = objectif>0 ? Math.round((auj/objectif)*100) : 0
      return { reference:ref, auj, cumul, total, taux, objectif, objPct }
    })
  })

  // Chaînes normales
  const zoneChaines = document.getElementById('zone-chaines')
  zoneChaines.innerHTML = ''
  CHAINES_NORMALES.forEach(ch => {
    zoneChaines.appendChild(creerCarteChaine(ch, dataParChaine[ch]||[]))
  })

  // Sections spéciales
  Object.entries(SECTIONS_SPECIALES).forEach(([ch, cfg]) => {
    const grid = document.getElementById(cfg.id)
    grid.innerHTML = ''
    const refs = dataParChaine[ch]||[]
    for (let i=0; i<cfg.maxRefs; i++) {
      grid.appendChild(creerPoste(refs[i]||null))
    }
  })

  document.getElementById('loading').style.display = 'none'
}

// ══ CARTE CHAÎNE ══
function creerCarteChaine(chaine, refs) {
  const r1 = refs[0]||null
  const r2 = refs[1]||null

  const card = document.createElement('div')
  card.className = 'chain-card'

  card.innerHTML = `<div class="chain-name">${chaine}</div>`

  // Refs
  const refsRow = document.createElement('div')
  refsRow.className = 'chain-refs-row'
  refsRow.innerHTML = `
    <div class="ref-col">
      <div class="ref-col-value ${r1?'':'empty'}">${r1?r1.reference:'—'}</div>
    </div>
    <div class="ref-col">
      <div class="ref-col-value ${r2?'':'empty'}">${r2?r2.reference:'—'}</div>
    </div>
  `
  card.appendChild(refsRow)

  // Données
  const dataRow = document.createElement('div')
  dataRow.className = 'chain-data'
  ;[r1, r2].forEach(r => {
    const col = document.createElement('div')
    col.className = 'ref-data-col'
    if (!r) {
      col.innerHTML = `
        <span class="val-obj-pct">0</span>
        <span class="val-taux">0%</span>
        <span class="val-counter neutral">0</span>
        <span class="val-cumul">0</span>
      `
    } else {
      const atteint = r.objectif>0 && r.auj>=r.objectif
      const cls     = r.objectif===0 ? 'neutral' : (atteint ? 'ok' : 'nok')
      col.innerHTML = `
        <span class="val-obj-pct">${r.objPct}</span>
        <span class="val-taux">${r.taux}%</span>
        <span class="val-counter ${cls}">${r.auj}</span>
        <span class="val-cumul">${r.cumul}</span>
      `
    }
    dataRow.appendChild(col)
  })
  card.appendChild(dataRow)

  return card
}

// ══ POSTE SECTION SPÉCIALE ══
function creerPoste(r) {
  const card = document.createElement('div')
  card.className = 'poste-card'

  const refsRow = document.createElement('div')
  refsRow.className = 'poste-refs-row'
  refsRow.innerHTML = `
    <div class="poste-ref-col">
      <div class="poste-ref-value ${r?'':'empty'}">${r?r.reference:'—'}</div>
    </div>
  `
  card.appendChild(refsRow)

  const dataRow = document.createElement('div')
  dataRow.className = 'poste-data-row'

  if (!r) {
    dataRow.innerHTML = `
      <div class="poste-data-col">
        <span class="poste-val-obj">0</span>
        <span class="poste-val-taux">0%</span>
        <span class="poste-counter neutral">0</span>
        <span class="poste-val-cumul">0</span>
      </div>
    `
  } else {
    const atteint = r.objectif>0 && r.auj>=r.objectif
    const cls     = r.objectif===0 ? 'neutral' : (atteint ? 'ok' : 'nok')
    dataRow.innerHTML = `
      <div class="poste-data-col">
        <span class="poste-val-obj">${r.objPct}</span>
        <span class="poste-val-taux">${r.taux}%</span>
        <span class="poste-counter ${cls}">${r.auj}</span>
        <span class="poste-val-cumul">${r.cumul}</span>
      </div>
    `
  }
  card.appendChild(dataRow)
  return card
}

// ══ REALTIME ══
db.channel('dash-live')
  .on('postgres_changes',{event:'*',schema:'public',table:'mouvements'},charger)
  .on('postgres_changes',{event:'*',schema:'public',table:'objectifs_journaliers'},charger)
  .subscribe()

charger()
setInterval(charger, 60000)
</script>
</body>
</html>
