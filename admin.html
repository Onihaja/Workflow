<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKANJO — Administration</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<header>
  <a class="home-link" href="index.html">
    <div class="logo-main">AKANJO</div>
    <div class="logo-sub">MADAGASCAR</div>
  </a>
  <div class="dept-label">Administration</div>
</header>

<div class="container" style="max-width:720px">

  <!-- Navigation rapide -->
  <div class="nav-links">
    <a class="nav-link-btn" href="coupe.html">✂ Coupe</a>
    <a class="nav-link-btn" href="atelier.html">🏭 Atelier</a>
    <a class="nav-link-btn" href="qualite.html">✓ Qualité</a>
    <a class="nav-link-btn" href="finition.html">📦 Finition</a>
    <a class="nav-link-btn" href="objectifs.html">🎯 Objectifs</a>
    <a class="nav-link-btn" href="dashboard.html">📊 Dashboard</a>
    <a class="nav-link-btn" href="historique.html">🕘 Historique</a>
  </div>

  <!-- Créer un compte -->
  <div class="card">
    <div class="section-title">Créer un compte</div>

    <div class="form-grid">
      <div class="field">
        <label>Nom complet *</label>
        <input type="text" id="new-nom" placeholder="ex: Marie Claire">
      </div>
      <div class="field">
        <label>Email *</label>
        <input type="email" id="new-email" placeholder="ex: marie@akanjo.mg">
      </div>
      <div class="field">
        <label>Mot de passe *</label>
        <input type="password" id="new-password" placeholder="Min. 8 caractères">
      </div>
      <div class="field">
        <label>Rôle *</label>
        <select class="field-select" id="new-role">
          <option value="" disabled selected>Choisir un rôle</option>
          <option value="it">Département IT</option>
          <option value="superviseur">Superviseur</option>
          <option value="admin">Administrateur</option>
        </select>
      </div>
    </div>

    <button class="main-btn" id="btn-creer-compte" onclick="creerCompte()">Créer le compte</button>
    <div class="msg" id="msg-create"></div>
  </div>

  <!-- Liste des utilisateurs -->
  <div class="card">
    <div class="section-title">Comptes existants</div>
    <div id="users-container">
      <div class="empty-state">Chargement...</div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="admin.js"></script>
<script src="auth.js"></script>
</body>
</html>
