<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKANJO — Administration</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="home-link" href="index.html">
    <div class="logo-main">AKANJO</div>
    <div class="logo-sub">MADAGASCAR</div>
  </a>
  <div class="dept-label">Administration</div>
</header>

<div class="container" style="max-width: 720px">

  <!-- Navigation rapide -->
  <div class="nav-links">
    <a class="nav-link-btn" href="coupe.html">✂ Coupe</a>
    <a class="nav-link-btn" href="atelier.html">🏭 Atelier</a>
    <a class="nav-link-btn" href="qualite.html">✓ Qualité</a>
    <a class="nav-link-btn" href="finition.html">📦 Finition</a>
    <a class="nav-link-btn" href="objectifs.html">🎯 Objectifs</a>
    <a class="nav-link-btn" href="dashboard.html">📊 Dashboard</a>
    <a class="nav-link-btn" href="historique.html">🕘 Historique</a>
  </div>

  <!-- Créer un compte -->
  <div class="card">
    <div class="section-title">Créer un compte</div>

    <div class="form-grid">
      <div class="field">
        <label>Nom complet *</label>
        <input type="text" id="new-nom" placeholder="ex: Marie Claire">
      </div>
      <div class="field">
        <label>Email *</label>
        <input type="email" id="new-email" placeholder="ex: marie@akanjo.mg">
      </div>
      <div class="field">
        <label>Mot de passe *</label>
        <input type="password" id="new-password" placeholder="Min. 8 caractères">
      </div>
      <div class="field">
        <label>Rôle *</label>
        <select class="field-select" id="new-role">
          <option value="" disabled selected>Choisir un rôle</option>
          <option value="it">Département IT</option>
          <option value="superviseur">Superviseur</option>
          <option value="admin">Administrateur</option>
        </select>
      </div>
    </div>

    <button class="main-btn" onclick="creerCompte()">Créer le compte</button>
    <div class="msg" id="msg-create"></div>
  </div>

  <!-- Liste des utilisateurs -->
  <div class="card">
    <div class="section-title">Comptes existants</div>
    <div id="users-container">
      <div class="empty-state">Chargement...</div>
    </div>
  </div>

</div>

<script src="auth.js"></script>
<script>
const SUPABASE_URL = window.SUPABASE_CONFIG?.url
const SUPABASE_KEY = window.SUPABASE_CONFIG?.anonKey
const { createClient } = supabase
const db = createClient(SUPABASE_URL, SUPABASE_KEY)

// ── CHARGER LES UTILISATEURS ──
async function chargerUtilisateurs() {
  const { data: profiles, error } = await db
    .from('profiles')
    .select('*')
    .order('created_at', { ascending: false })

  const container = document.getElementById('users-container')

  if (error || !profiles?.length) {
    container.innerHTML = '<div class="empty-state">Aucun utilisateur trouvé.</div>'
    return
  }

  const table = document.createElement('table')
  table.className = 'users-table'
  table.innerHTML = `
    <thead>
      <tr>
        <th>Nom</th>
        <th>Rôle</th>
        <th>Créé le</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  `

  const tbody = table.querySelector('tbody')

  profiles.forEach(p => {
    const tr = document.createElement('tr')
    tr.innerHTML = `
      <td><strong>${p.nom}</strong></td>
      <td><span class="role-badge role-${p.role}">${labelRole(p.role)}</span></td>
      <td style="color:#aaa;font-size:12px">${new Date(p.created_at).toLocaleDateString('fr-FR')}</td>
      <td>
        ${p.role !== 'admin' ? `<button class="btn-danger" onclick="supprimerCompte('${p.id}', '${p.nom}')">Supprimer</button>` : '<span style="font-size:11px;color:#ccc">—</span>'}
      </td>
    `
    tbody.appendChild(tr)
  })

  container.innerHTML = ''
  container.appendChild(table)
}

// ── CRÉER UN COMPTE ──
async function creerCompte() {
  const nom      = document.getElementById('new-nom').value.trim()
  const email    = document.getElementById('new-email').value.trim()
  const password = document.getElementById('new-password').value
  const role     = document.getElementById('new-role').value
  const msg      = document.getElementById('msg-create')

  if (!nom || !email || !password || !role) {
    afficherMsg('msg-create', 'error', 'Tous les champs sont obligatoires.')
    return
  }

  if (password.length < 8) {
    afficherMsg('msg-create', 'error', 'Le mot de passe doit contenir au moins 8 caractères.')
    return
  }

  const btn = document.querySelector('.card button.main-btn')
  btn.disabled = true
  btn.textContent = 'Création...'

  // Créer le compte via Supabase Auth
  const { data, error } = await db.auth.admin.createUser({
    email,
    password,
    email_confirm: true
  })

  if (error) {
    btn.disabled = false
    btn.textContent = 'Créer le compte'
    afficherMsg('msg-create', 'error', 'Erreur : ' + error.message)
    return
  }

  // Créer le profil
  const { error: profileError } = await db.from('profiles').insert([{
    id:   data.user.id,
    nom,
    role
  }])

  btn.disabled = false
  btn.textContent = 'Créer le compte'

  if (profileError) {
    afficherMsg('msg-create', 'error', 'Compte créé mais erreur profil : ' + profileError.message)
    return
  }

  afficherMsg('msg-create', 'success', `✓ Compte de ${nom} créé avec succès.`)

  // Reset formulaire
  document.getElementById('new-nom').value = ''
  document.getElementById('new-email').value = ''
  document.getElementById('new-password').value = ''
  document.getElementById('new-role').value = ''

  chargerUtilisateurs()
}

// ── SUPPRIMER UN COMPTE ──
async function supprimerCompte(id, nom) {
  if (!confirm(`Supprimer le compte de ${nom} ?`)) return

  // Supprimer le profil (la suppression auth nécessite service_role)
  const { error } = await db.from('profiles').delete().eq('id', id)

  if (error) {
    alert('Erreur lors de la suppression : ' + error.message)
    return
  }

  chargerUtilisateurs()
}

// ── HELPERS ──
function labelRole(role) {
  const map = { admin: 'Admin', it: 'Dept. IT', superviseur: 'Superviseur' }
  return map[role] || role
}

function afficherMsg(id, type, texte) {
  const el = document.getElementById(id)
  el.className = `msg ${type}`
  el.textContent = texte
}

// ── INIT ──
chargerUtilisateurs()
</script>
</body>
</html>
